<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E18"/>
      <stop offset="100%" stop-color="#0A120E"/>
    </linearGradient>
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0E9E96"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5FF66"/>
      <stop offset="100%" stop-color="#D6FF3D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D6FF3D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#0E9E96" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Padel Racket / Monogram 'P' Form -->
  <!-- Racket Head Frame -->
  <path d="M16 14 C16 11.8 17.8 10 20 10 L34 10 C42.8 10 49 16.2 49 25 C49 33.8 42.8 40 34 40 L26 40 L26 51 C26 52.7 24.7 54 23 54 L19 54 C17.3 54 16 52.7 16 51 Z" fill="#FFFFFF"/>
  
  <!-- Inner Sweetspot / Turf Core -->
  <path d="M26 18 L33 18 C37.4 18 41 21.1 41 25 C41 28.9 37.4 32 33 32 L26 32 Z" fill="url(#turfGrad)"/>

  <!-- Racket Perforations (3 Aerodynamic Holes) -->
  <circle cx="30" cy="25" r="2.2" fill="#141E18"/>
  <circle cx="35" cy="22" r="1.8" fill="#141E18"/>
  <circle cx="35" cy="28" r="1.8" fill="#141E18"/>

  <!-- Energetic Optic Yellow Padel Ball with Glow -->
  <circle cx="48" cy="46" r="7.5" fill="url(#ballGrad)" filter="url(#glow)"/>
  <!-- Ball Seam Line Curve -->
  <path d="M44.5 42.5 C46.5 45 46.5 47 44.5 49.5" stroke="#141E18" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M51.5 42.5 C49.5 45 49.5 47 51.5 49.5" stroke="#141E18" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
